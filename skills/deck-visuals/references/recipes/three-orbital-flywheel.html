<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <script type="module">
    import * as THREE from "/node_modules/three/build/three.module.js";

    const tokens = window.BRAND_TOKENS || {};
    const dp = tokens.darkPalette || tokens.palette || {};
    const bg = dp.background || "#061527";
    const surface = dp.surface || "#0F2540";
    const primary = dp.primary || "#38BDF8";
    const accent = dp.accent || "#2DD4BF";
    const nodeCount = Number(window.VISUAL_DATA?.nodes || 5);

    const transparent = Boolean(window.VISUAL_TRANSPARENT);
    const width = window.innerWidth;
    const height = window.innerHeight;
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(window.devicePixelRatio || 1);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    if (!transparent) scene.background = new THREE.Color(bg);

    const camera = new THREE.PerspectiveCamera(34, width / height, 0.1, 100);
    camera.position.set(0, 1.4, 7.6);
    camera.lookAt(0, 0, 0);

    scene.add(new THREE.AmbientLight("#94B8D8", 0.6));
    const key = new THREE.DirectionalLight(primary, 2.8);
    key.position.set(4, 6, 5);
    scene.add(key);
    const rim = new THREE.DirectionalLight(accent, 2.4);
    rim.position.set(-4, -2, 3);
    scene.add(rim);

    const wheel = new THREE.Group();
    wheel.rotation.x = 0.45;
    scene.add(wheel);

    wheel.add(
      new THREE.Mesh(
        new THREE.TorusGeometry(1.75, 0.08, 24, 128),
        new THREE.MeshPhysicalMaterial({ color: surface, emissive: primary, emissiveIntensity: 0.35, metalness: 0.4, roughness: 0.15, clearcoat: 1.0 })
      )
    );
    wheel.add(
      new THREE.Mesh(
        new THREE.TorusGeometry(2.15, 0.015, 12, 128),
        new THREE.MeshBasicMaterial({ color: accent, transparent: true, opacity: 0.5 })
      )
    );

    const center = new THREE.Mesh(
      new THREE.OctahedronGeometry(0.55, 0),
      new THREE.MeshPhysicalMaterial({ color: accent, emissive: accent, emissiveIntensity: 0.35, metalness: 0.3, roughness: 0.12, clearcoat: 1.0 })
    );
    wheel.add(center);

    const nodes = [];
    for (let i = 0; i < nodeCount; i++) {
      const a = (i * Math.PI * 2) / nodeCount;
      const col = i % 2 === 0 ? primary : accent;
      const g = new THREE.Group();
      g.add(
        new THREE.Mesh(
          new THREE.BoxGeometry(0.46, 0.46, 0.46),
          new THREE.MeshPhysicalMaterial({ color: surface, emissive: col, emissiveIntensity: 0.28, metalness: 0.25, roughness: 0.15, clearcoat: 1.0, transparent: true, opacity: 0.92 })
        )
      );
      g.add(new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(0.46, 0.46, 0.46)), new THREE.LineBasicMaterial({ color: col })));
      g.position.set(Math.cos(a) * 1.75, Math.sin(a) * 1.75, 0);
      wheel.add(g);
      nodes.push(g);
    }

    window.renderFrame = (t = 0) => {
      const a = t * Math.PI * 2;
      wheel.rotation.z = a;
      center.rotation.y = -a * 2;
      nodes.forEach((n, idx) => {
        n.rotation.x = a + idx;
        n.rotation.y = a * 0.5;
      });
      renderer.render(scene, camera);
    };
    window.renderFrame(0.08);
  </script>
</body>
</html>
