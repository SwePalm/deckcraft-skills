<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <script type="module">
    import * as THREE from "/node_modules/three/build/three.module.js";

    const tokens = window.BRAND_TOKENS || {};
    const p = tokens.palette || {
      background: "#0B1326",
      surface: "#15223B",
      primary: "#38BDF8",
      secondary: "#818CF8",
      accent: "#34D399",
      text: "#F8FAFC",
    };

    const transparent = Boolean(window.VISUAL_TRANSPARENT);
    const width = window.innerWidth;
    const height = window.innerHeight;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(window.devicePixelRatio || 1);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    if (!transparent) {
      scene.background = new THREE.Color(p.background);
    }

    const camera = new THREE.PerspectiveCamera(36, width / height, 0.1, 100);
    camera.position.set(0, 0.4, 7.4);
    camera.lookAt(0, 0, 0);

    // Brand-tokenized 3-point studio lighting
    scene.add(new THREE.AmbientLight(p.text, 0.55));
    const keyLight = new THREE.DirectionalLight(p.primary, 2.4);
    keyLight.position.set(4, 5, 4);
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(p.accent, 1.8);
    rimLight.position.set(-4, -2, 3);
    scene.add(rimLight);

    const backLight = new THREE.PointLight(p.secondary, 2.2, 20);
    backLight.position.set(0, 2.5, -3.5);
    scene.add(backLight);

    const group = new THREE.Group();
    scene.add(group);

    // Core sculpted icosahedron
    const coreGeo = new THREE.IcosahedronGeometry(1.18, 1);
    const coreMat = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color(p.surface),
      emissive: new THREE.Color(p.primary),
      emissiveIntensity: 0.14,
      metalness: 0.35,
      roughness: 0.22,
      clearcoat: 0.9,
      clearcoatRoughness: 0.12,
      flatShading: true,
    });
    const coreMesh = new THREE.Mesh(coreGeo, coreMat);
    group.add(coreMesh);

    // Crisp luminous wireframe cage
    const wireGeo = new THREE.IcosahedronGeometry(1.34, 1);
    const wireMat = new THREE.MeshBasicMaterial({
      color: new THREE.Color(p.primary),
      wireframe: true,
      transparent: true,
      opacity: 0.42,
    });
    const wireMesh = new THREE.Mesh(wireGeo, wireMat);
    group.add(wireMesh);

    // Two tilted orbital rings
    const ring1 = new THREE.Mesh(
      new THREE.TorusGeometry(1.85, 0.022, 16, 128),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(p.primary), transparent: true, opacity: 0.7 })
    );
    ring1.rotation.set(Math.PI * 0.38, Math.PI * 0.12, 0);
    group.add(ring1);

    const ring2 = new THREE.Mesh(
      new THREE.TorusGeometry(2.12, 0.014, 16, 128),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(p.accent), transparent: true, opacity: 0.55 })
    );
    ring2.rotation.set(-Math.PI * 0.32, Math.PI * 0.25, 0);
    group.add(ring2);

    // Orbiting data nodes
    const nodes = [];
    const nodeColors = [p.primary, p.accent, p.secondary];
    for (let i = 0; i < 3; i++) {
      const n = new THREE.Mesh(
        new THREE.SphereGeometry(0.085, 24, 24),
        new THREE.MeshBasicMaterial({ color: new THREE.Color(nodeColors[i]) })
      );
      group.add(n);
      nodes.push(n);
    }

    // Deterministic seamless loop: t in [0, 1)
    window.renderFrame = (t = 0) => {
      const a = t * Math.PI * 2;
      coreMesh.rotation.y = a;
      coreMesh.rotation.x = Math.sin(a) * 0.22;
      wireMesh.rotation.y = -a * 0.5;
      wireMesh.rotation.z = Math.cos(a) * 0.15;
      ring1.rotation.z = a;
      ring2.rotation.z = -a;
      for (let i = 0; i < nodes.length; i++) {
        const phase = a + (i * Math.PI * 2) / nodes.length;
        const r = 1.85;
        nodes[i].position.set(Math.cos(phase) * r, Math.sin(phase) * 0.72, Math.sin(phase) * r * 0.65);
      }
      renderer.render(scene, camera);
    };

    window.renderFrame(0);
  </script>
</body>
</html>
